{% extends 'base.html' %}

{% block title %}Add New Student - Student Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
                <h4 class="fw-bold mb-0"><i class="bi bi-person-plus-fill text-primary me-2"></i>Add New Student</h4>
                <a href="/students" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to List
                </a>
            </div>

            <form method="POST" action="/students/add">
                <h6 class="fw-bold text-primary mb-3"><i class="bi bi-info-circle me-1"></i> Personal & Academic Information</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Roll Number <span class="text-danger">*</span></label>
                        <input type="text" name="roll_no" class="form-control" placeholder="e.g. CS2026001" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Course <span class="text-danger">*</span></label>
                        <select name="course" class="form-select" required>
                            <option value="" disabled selected>Select Course</option>
                            <option value="B.Tech Computer Science">B.Tech Computer Science</option>
                            <option value="B.Tech Information Technology">B.Tech Information Technology</option>
                            <option value="BCA">BCA</option>
                            <option value="MCA">MCA</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Semester <span class="text-danger">*</span></label>
                        <select name="semester" class="form-select" required>
                            <option value="" disabled selected>Select Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                        <input type="tel" name="phone" class="form-control" placeholder="e.g. +91 9876543210" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" placeholder="e.g. student@college.edu" required>
                    </div>
                </div>

                <h6 class="fw-bold text-primary mb-3"><i class="bi bi-cash-coin me-1"></i> Fee Setup (Optional)</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Total Fee (₹)</label>
                        <input type="number" step="0.01" name="total_fee" class="form-control" placeholder="e.g. 50000" value="50000">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Paid Amount (₹)</label>
                        <input type="number" step="0.01" name="paid_amount" class="form-control" placeholder="e.g. 25000" value="0">
                    </div>
                </div>

                <h6 class="fw-bold text-primary mb-3"><i class="bi bi-journal-bookmark me-1"></i> Initial Marks Setup (Optional)</h6>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">CT-1 Marks (Max 25)</label>
                        <input type="number" step="0.5" name="ct1" class="form-control" placeholder="0 - 25" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">CT-2 Marks (Max 25)</label>
                        <input type="number" step="0.5" name="ct2" class="form-control" placeholder="0 - 25" value="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Semester Exam (Max 100)</label>
                        <input type="number" step="0.5" name="sem_exam" class="form-control" placeholder="0 - 100" value="0">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/students" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold">Save Student</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
