{% extends 'base.html' %}

{% block title %}Page Not Found (404) - Student Management System{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-exclamation-circle text-warning display-1 mb-3"></i>
        <h1 class="fw-bold mb-2">404 - Page Not Found</h1>
        <p class="text-muted mb-4">The requested page or URL could not be found on the server.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-rounded px-4 py-2 fw-bold">
            <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
