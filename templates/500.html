{% extends 'base.html' %}

{% block title %}Server Error (500) - Student Management System{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-x-circle text-danger display-1 mb-3"></i>
        <h1 class="fw-bold mb-2">500 - Internal Server Error</h1>
        <p class="text-muted mb-4">Something went wrong on the server. Please try refreshing or return to the dashboard.</p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-rounded px-4 py-2 fw-bold">
            <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
